<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{background:#fff;padding:20px;font-family:var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:12px;padding:12px;height:96px;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:13px}.sw small{font-weight:600;font-size:11px;opacity:.9}.lbl{font-size:11px;color:var(--text-secondary);font-weight:600}</style></head><body><div class="row" style="display:grid;grid-template-columns:repeat(5,1fr)"><div class="sw" style="background:var(--cp-data-yellow);color:#242424;"><span>Yellow</span><small>#F2C924</small></div><div class="sw" style="background:var(--cp-data-orange);color:#fff;"><span>Orange</span><small>#FF7F08</small></div><div class="sw" style="background:var(--cp-data-pink);color:#fff;"><span>Punch Pink</span><small>#FF575F</small></div><div class="sw" style="background:var(--cp-data-magenta);color:#fff;"><span>Deep Magenta</span><small>#D70085</small></div><div class="sw" style="background:var(--cp-data-purple);color:#fff;"><span>Purple</span><small>#9B31C8</small></div><div class="sw" style="background:var(--cp-data-violet);color:#fff;"><span>Violet-Blue</span><small>#5917FF</small></div><div class="sw" style="background:var(--cp-data-turquoise);color:#242424;"><span>Turquoise</span><small>#17E8FF</small></div><div class="sw" style="background:var(--cp-data-blue);color:#fff;"><span>Blue</span><small>#2D77C1</small></div><div class="sw" style="background:var(--cp-data-electric);color:#242424;"><span>Electric Green</span><small>#48E101</small></div><div class="sw" style="background:var(--cp-data-green);color:#fff;"><span>Green</span><small>#159912</small></div></div></body></html>
