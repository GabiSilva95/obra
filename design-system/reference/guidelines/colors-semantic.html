<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{background:#fff;padding:20px;font-family:var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:12px;padding:12px;height:96px;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:13px}.sw small{font-weight:600;font-size:11px;opacity:.9}.lbl{font-size:11px;color:var(--text-secondary);font-weight:600}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px"><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--bg-app);border:1px solid var(--border-default)"></span><code style="font-size:12px;font-weight:700">--bg-app</code><span class="lbl">App background</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--surface-card);border:1px solid var(--border-default)"></span><code style="font-size:12px;font-weight:700">--surface-card</code><span class="lbl">Card</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--surface-sidebar);border:1px solid var(--border-default)"></span><code style="font-size:12px;font-weight:700">--surface-sidebar</code><span class="lbl">Sidebar</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--accent);border:1px solid var(--border-default)"></span><code style="font-size:12px;font-weight:700">--accent</code><span class="lbl">Accent / active</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--border-default)"></span><code style="font-size:12px;font-weight:700">--accent-soft</code><span class="lbl">Accent soft</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--text-primary);border:1px solid var(--border-default)"></span><code style="font-size:12px;font-weight:700">--text-primary</code><span class="lbl">Text primary</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--text-secondary);border:1px solid var(--border-default)"></span><code style="font-size:12px;font-weight:700">--text-secondary</code><span class="lbl">Text secondary</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--text-accent);border:1px solid var(--border-default)"></span><code style="font-size:12px;font-weight:700">--text-accent</code><span class="lbl">Text accent</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--border-default);border:1px solid var(--border-default)"></span><code style="font-size:12px;font-weight:700">--border-default</code><span class="lbl">Border</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--status-success);border:1px solid var(--border-default)"></span><code style="font-size:12px;font-weight:700">--status-success</code><span class="lbl">Status success</span></div></div></body></html>
