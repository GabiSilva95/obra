<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{background:#fff;padding:20px;font-family:var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:12px;padding:12px;height:96px;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:13px}.sw small{font-weight:600;font-size:11px;opacity:.9}.lbl{font-size:11px;color:var(--text-secondary);font-weight:600}</style></head><body><div class="row"><div class="sw" style="background:var(--cp-black);color:#fff;"><span>Black</span><small>#242424</small></div><div class="sw" style="background:var(--cp-gray-500);color:#fff;"><span>Main Gray</span><small>#8F8F8F</small></div><div class="sw" style="background:var(--cp-gray-300);color:#242424;"><span>Light Gray</span><small>#E0E0E0</small></div><div class="sw" style="background:var(--cp-gray-50);color:#242424;border:1px solid var(--border-default)"><span>Primary BG</span><small>#FAFAFA</small></div><div class="sw" style="background:var(--cp-white);color:#242424;border:1px solid var(--border-default)"><span>White</span><small>#FEFEFE</small></div></div></body></html>
